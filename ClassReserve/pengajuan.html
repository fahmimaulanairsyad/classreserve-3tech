<!DOCTYPE html>
<html>
<head>
    <title>Pengajuan Peminjaman</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h2>ClassReserve</h2>

    <ul>
        <li onclick="goTo('dashboard.html')">Dashboard</li>
        <li>Pengajuan Peminjaman</li>
        <li onclick="logout()">Logout</li>
    </ul>
</div>
<div class="dashboard">

<div style="display:flex; gap:30px; align-items:flex-start;">

<div class="card" style="width:550px;">

<h1>Form Pengajuan Peminjaman</h1>

<br>

<div class="input-group">
<label>Nama Kegiatan</label>
<input type="text" id="kegiatan" placeholder="Masukkan nama kegiatan">
</div>

<div class="input-group">
<label>Tanggal</label>
<input type="date" id="tanggal">
</div>

<div style="display:flex; gap:20px;">

<div class="input-group" style="width:50%;">
<label>Waktu Mulai</label>
<input type="time" id="mulai">
</div>
<div class="input-group" style="width:50%;">
<label>Waktu Berakhir</label>
<input type="time" id="selesai">
</div>

</div>

<div class="input-group">
<label>Catatan / Keterangan</label>
<textarea id="keterangan" style="width:100%; height:120px; padding:15px; border-radius:10px; border:1px solid #ccc;"></textarea>
</div>

<button class="btn" onclick="submitPeminjaman()">
Ajukan Peminjaman
</button>

</div>
<div class="card" style="width:400px;">

<h1>Pilih Ruangan</h1>
<p class="subtitle">Pilih ruangan yang tersedia</p>

<div style="padding:20px; border:1px solid #ddd; border-radius:10px; margin-bottom:20px;">
<h3>Ruang 101 - Kelas</h3>
<p>Kapasitas: 40 orang</p>
<br>
<span style="background:#bbf7d0; color:green; padding:8px 15px; border-radius:20px;">
Tersedia
</span>
</div>

<div style="padding:20px; border:1px solid #ddd; border-radius:10px; margin-bottom:20px;">
<h3>Ruang 102 - Kelas</h3>
<p>Kapasitas: 40 orang</p>
<br>
<span style="background:#fecaca; color:red; padding:8px 15px; border-radius:20px;">
Terisi
</span>
</div>
<div style="padding:20px; border:1px solid #ddd; border-radius:10px; margin-bottom:20px;">
<h3>Ruang 201 - Laboratorium</h3>
<p>Kapasitas: 30 orang</p>
<br>
<span style="background:#bbf7d0; color:green; padding:8px 15px; border-radius:20px;">
Tersedia
</span>
</div>

</div>

</div>

</div>

<script src="js/script.js"></script>
</body>
</html>

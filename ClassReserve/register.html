<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <div class="logo">🏫</div>
    <div class="logo-text">ClassReserve</div>
</div>

<div class="center-container">

<div class="card">

<h1>Register</h1>
<p class="subtitle">Buat akun baru untuk mulai menggunakan ClassReserve</p>

<div class="input-group">
    <label>Nama Lengkap</label>
<input type="text" id="name" placeholder="Masukkan nama lengkap">
</div>

<div class="input-group">
<label>Email Student</label>
<input type="email" id="email" placeholder="contoh@student.ac.id">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Masukkan password">
</div>

<div class="input-group">
<label>Konfirmasi Password</label>
<input type="password" id="confirm" placeholder="Konfirmasi password">
</div>
<button class="btn" onclick="registerUser()">Register</button>

<div class="link">
Sudah punya akun?
<a href="login-student.html">Login di sini</a>
</div>

</div>

</div>

<script src="js/script.js"></script>
</body>
</html>
